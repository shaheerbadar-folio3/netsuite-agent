services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_OLLAMA_URL: http://ollama:11434
      AGENT_PRIVATE_KEY_PATH: /run/secrets/netsuite_private_key
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - agent-data:/app/data
      - ./knowledge:/app/knowledge:ro
    secrets:
      - netsuite_private_key
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    # No published inference port. The agent reaches it on the private compose network.
volumes:
  agent-data:
  ollama-models:
secrets:
  netsuite_private_key:
    file: ./secrets/private.pem
